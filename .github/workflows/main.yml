name: Lumen Note AI - Preview Audit

on:
  workflow_dispatch:

jobs:
  preview-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository structure
        run: |
          echo "========================================"
          echo "RAIZ DEL CHECKOUT"
          echo "========================================"
          pwd
          ls -la

          echo ""
          echo "========================================"
          echo "ARBOLES DE DIRECTORIOS"
          echo "========================================"
          find . -maxdepth 3 -type d \
            -not -path "*/.git/*" \
            -not -path "*/node_modules/*" \
            | sort

          echo ""
          echo "========================================"
          echo "TODOS LOS PACKAGE.JSON"
          echo "========================================"
          find . -name "package.json" \
            -not -path "*/node_modules/*" \
            -print

          echo ""
          echo "========================================"
          echo "TODOS LOS ARCHIVOS DE CONFIGURACION"
          echo "========================================"
          find . -maxdepth 4 -type f \( \
            -name "package.json" -o \
            -name "package-lock.json" -o \
            -name "npm-shrinkwrap.json" -o \
            -name "yarn.lock" -o \
            -name "pnpm-lock.yaml" -o \
            -name "vite.config.*" -o \
            -name "tsconfig.json" \
          \) \
            -not -path "*/node_modules/*" \
            -print

          echo ""
          echo "========================================"
          echo "BUSQUEDA DE createClient"
          echo "========================================"
          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude="*.lock" \
            "createClient" . || true

          echo ""
          echo "========================================"
          echo "BUSQUEDA DE @supabase/supabase-js"
          echo "========================================"
          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            "@supabase/supabase-js" . || true

          echo ""
          echo "========================================"
          echo "BUSQUEDA DE VITE_SUPABASE_URL"
          echo "========================================"
          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            "VITE_SUPABASE_URL" . || true

