name: Lumen Note AI - Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Lumen Note AI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lumen-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify frontend files
        run: |
          test -f package.json
          test -f vite.config.ts
          test -f tsconfig.json
          test -f index.html
          test -f src/main.tsx

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

