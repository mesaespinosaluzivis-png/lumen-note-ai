name: Lumen Note AI Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Lumen Note AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Show repository root
        run: |
          pwd
          ls -la

      - name: Install dependencies
        run: npm ci

      - name: Build Lumen Note AI
        run: npm run build

      - name: Verify Vite build
        run: |
          test -d dist
          test -f dist/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-note-ai-dist
          path: dist/


