name: Lumen Note AI Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Lumen Note AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify project root
        shell: bash
        run: |
          test -f package.json
          test -f package-lock.json
          test -f tsconfig.json
          test -f vite.config.ts
          test -f index.html
          test -d src
          test -f src/main.tsx

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify Vite output
        shell: bash
        run: |
          test -d dist
          test -f dist/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-note-ai-dist
          path: dist/

